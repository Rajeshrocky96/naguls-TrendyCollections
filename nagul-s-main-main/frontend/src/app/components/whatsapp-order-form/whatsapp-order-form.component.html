<div class="order-form-container">
  <h2 class="section-title">WhatsApp Orders</h2>
  <div class="loading-overlay" *ngIf="isLoading">
    <div class="spinner"></div>
  </div>
  <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="order-form">

    <!-- Order Details -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="form-group">
        <mat-label>Order Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="orderDate" [max]="maxDate">
        <mat-datepicker-toggle matSuffix [for]="picker" >
          <mat-icon matDatepickerToggleIcon>calendar_today</mat-icon>
        </mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-group">
        <mat-label>Order Source</mat-label>
        <mat-select formControlName="orderSource">
          <mat-option value="WhatsApp">WhatsApp</mat-option>
          <mat-option value="Instagram">Instagram</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Customer Details -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="form-group">
        <mat-label>Customer Name</mat-label>
        <input matInput type="text" formControlName="customerName" placeholder="Enter customer name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-group">
        <mat-label>Phone Number</mat-label>
        <input matInput type="tel" formControlName="phoneNumber" maxlength="10" placeholder="10-digit number">
      </mat-form-field>
    </div>

    <!-- Delivery Info -->
    <div class="form-row">
      <mat-form-field appearance="outline" class="form-group">
        <mat-label>Delivery Address</mat-label>
        <textarea matInput formControlName="deliveryAddress" rows="2" placeholder="Complete delivery address"></textarea>
      </mat-form-field>
    </div>

        <!-- Customer Details -->
        <div class="form-row">
          <mat-form-field appearance="outline" class="form-group">
            <mat-label>Special Instructions</mat-label>
            <input matInput type="text" placeholder="special instructions" formControlName="specialInstructions">
          </mat-form-field>
        </div>

    <!-- Products Section -->
    <div class="products-section">
      <div class="products-header">
        <h3>Products</h3>
        <button mat-stroked-button color="primary" type="button" class="btn-add-product" (click)="addProduct()">+ Add Product</button>
      </div>

      <div class="products-grid" formArrayName="products">
        <div *ngFor="let product of products.controls; let i = index" [formGroupName]="i" class="product-row">
          <mat-form-field appearance="outline" class="form-group">
            <mat-label>Product Code</mat-label>
            <input matInput type="text" formControlName="productCode" placeholder="Enter code">
          </mat-form-field>

          <mat-form-field appearance="outline" class="form-group">
            <mat-label>Quantity</mat-label>
            <input matInput type="number" formControlName="quantity" min="1">
          </mat-form-field>

          <button mat-stroked-button color="warn" type="button" class="btn-remove-product" (click)="removeProduct(i)" *ngIf="products.length > 1">
            <mat-icon>close</mat-icon>
            Remove
          </button>
          
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit" class="btn-submit-order">Submit Order</button>
      <button mat-stroked-button color="warn" type="button" class="btn-reset" (click)="onReset()">Reset</button>
    </div>
    <!-- Toast Notification -->
    <div class="toast-container">
      <div class="toast-notification" *ngIf="toastVisible" [ngClass]="toastStatusClass">
        <div class="toast-content">
          <span class="toast-icon" *ngIf="toastStatusClass === 'success'">&#10003;</span>
          <span class="toast-icon" *ngIf="toastStatusClass === 'error'">&#10005;</span>
          <span class="toast-message">{{ toastMessage }}</span>
        </div>
      </div>
    </div>
  </form>
</div>
